# METRIC 3: Concurrency (average in-flight requests)
#
# "Each pod should handle about N requests AT THE SAME TIME." This is what Knative and
# many service meshes scale on. It beats RPS when request cost varies, because a slow
# request holds a worker for longer.
#
# podinfo has no in-flight gauge, so concurrency is derived with Little's law:
#     avg in-flight = rate(total seconds spent serving requests)
#   = sum(rate(http_request_duration_seconds_sum[1m]))
# (If your app exports an in-flight gauge, e.g. http_server_active_requests, use sum() of that.)
#
# AverageValue:  replicas = ceil(total_in_flight / threshold)
#   e.g. 20 concurrent requests with threshold 5  ->  4 pods
#
# Demo contrast: 20 connections x /delay/2 is only ~10 req/s (RPS scaler stays at 1 pod)
# but 20 in flight (this scaler goes to 4 pods).
#
# Test:  make scaler S=03-concurrency && make load L=slow
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: podinfo-concurrency
  namespace: app
spec:
  scaleTargetRef:
    name: podinfo-d
  minReplicaCount: 1
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Pods, value: 4, periodSeconds: 15 }
            - { type: Percent, value: 100, periodSeconds: 15 }
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - { type: Percent, value: 50, periodSeconds: 30 }
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        query: >-
          sum(rate(http_request_duration_seconds_sum{namespace="app",job="podinfo-svc",path!~"readyz|healthz|metrics"}[1m])) or vector(0)
        threshold: "5"
