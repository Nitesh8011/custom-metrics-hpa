# Load for METRIC 3 (concurrency): 20 connections, each waiting on a 2-second response.
#   - ~10 req/s only, but ~20 requests are always in flight.
#   - 03-concurrency scaler: 20 / 5 per pod -> ~4 pods
#   - 01-rps scaler:         10 / 50 per pod -> stays at 1 pod (blind to slow requests)
#   - p95 latency is ~2 s the whole time, regardless of pod count (so the latency
#     scaler would run to max here: the "latency isn't capacity-bound" trap).
#
# Run: make load L=slow      Stop: make stop-load
#
# Connections are recycled (-connection-reuse 2:4: a connection is replaced after that many
# requests). Kubernetes Services balance per CONNECTION, so with fortio's default of
# never-ending keep-alive connections, pods added by the autoscaler would receive no traffic
# from this running load and the per-pod dashboards would show one busy pod and idle ones.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-slow
  namespace: app
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      restartPolicy: Never
      containers:
        - name: fortio
          image: fortio/fortio:1.76.0
          # -qps 0 = no rate limit: every connection fires its next request as soon
          # as the previous one returns, i.e. a fixed concurrency of 20.
          args: ["load", "-qps", "0", "-c", "20", "-t", "10m", "-connection-reuse", "2:4", "-quiet", "http://podinfo-svc.app/delay/2"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
